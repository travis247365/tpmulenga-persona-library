name = "jobsearch-ingest"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Email Routing delivers forwarded alerts to the email() handler. Configure the
# catch-all or a jobs@ rule to this worker in the Cloudflare dashboard under
# Email > Email Routing > Routes.

[[d1_databases]]
binding = "DB"
database_name = "jobsearch"
database_id = "REPLACE_AFTER_CREATE"

[vars]
# These are substituted by scripts/deploy-all.sh from the Pages project name,
# not edited by hand. They are the CORS allowlist and the check is fail-closed,
# so an origin that does not match the deployed site silently blocks signup and
# the feed - renaming the Pages project without changing these is exactly the
# kind of mismatch that looks like "the button does nothing".
DASHBOARD_ORIGIN = "REPLACE_DASHBOARD_ORIGIN"
APP_ORIGIN = "REPLACE_APP_ORIGIN"
# The domain Email Routing accepts mail on. Signup hands users
# jobs+<token>@INGEST_DOMAIN, so a wrong value here mints addresses that
# silently never receive anything.
INGEST_DOMAIN = "REPLACE_WITH_YOUR_EMAIL_ROUTING_DOMAIN"

# Outbound mail for the job pack.
#
# Pinned to ONE destination on purpose. Cloudflare only delivers to addresses
# verified in Email Routing, and naming the address here means the worker
# cannot mail anyone else even if a bug or a bad row in reply_settings asks it
# to. deploy-all.sh removes this block entirely when REPLY_TO is unset, so a
# deploy that has not been told where to send simply has no way to send.
[[send_email]]
name = "SEND"
destination_address = "REPLACE_REPLY_TO"
