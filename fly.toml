# fly.io deployment for the persona library.
#
# Deploy with:  fly launch --no-deploy   (first time, to create the app)
#               fly deploy
#
# The server reads PORT from the environment, so internal_port below is the
# only place the port is set.

app = "tpmulenga-persona-library"
primary_region = "jnb"          # Johannesburg - nearest region to Lusaka

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0      # scales to zero; a portfolio site is idle most of the time

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
